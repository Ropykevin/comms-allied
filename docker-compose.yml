services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: allied-comms-app
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5050:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - allied_comms_network

  db:
    image: postgres:16-alpine
    container_name: allied-comms-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - allied_comms_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - allied_comms_network

volumes:
  allied_comms_postgres_data:

networks:
  allied_comms_network:
    driver: bridge