user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $uri instead of $request: query strings (unsubscribe/tracking tokens, search terms with
    # client names or phone numbers) never reach the logs. Referer is dropped for the same reason.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Slightly above the app's 10 MB MAX_CONTENT_LENGTH so Flask returns the friendly 413 page.
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    upstream allied_web {
        server web:8000;
        keepalive 16;
    }

    # HTTP: only ACME challenges (Let's Encrypt) and a redirect to HTTPS.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;

        location /static/ {
            alias /usr/share/nginx/static/;
            expires 1h;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            access_log off;
        }

        # Optional: only accept SMS delivery reports / inbound SMS from Africa's Talking.
        # Get their current callback IP ranges from Africa's Talking support, then uncomment.
        # location /webhooks/sms/ {
        #     allow 192.0.2.0/24;   # replace with Africa's Talking ranges
        #     deny all;
        #     proxy_pass http://allied_web;
        # }

        location / {
            proxy_pass http://allied_web;
        }
    }
}
