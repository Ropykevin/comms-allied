name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: allied_test
          POSTGRES_USER: allied
          POSTGRES_PASSWORD: allied
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allied"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://allied:allied@localhost:5432/allied_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci --no-audit --no-fund

      - name: Build CSS
        run: npm run build:css

      - name: Tests (PostgreSQL)
        run: pytest -q

      - name: Tests (SQLite)
        run: TEST_DATABASE_URL= pytest -q

      - name: Migrations apply cleanly and match the models
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://allied:allied@localhost:5432/allied_test
        run: |
          psql postgresql://allied:allied@localhost:5432/allied_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          flask --app run db upgrade
          flask --app run db check
          flask --app run db downgrade base

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build --target app -t allied-chat:ci .
          docker build --target nginx -t allied-chat-nginx:ci .
