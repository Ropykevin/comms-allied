{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% macro error_body() %}
<div class="flex flex-col items-center justify-center py-24 text-center">
  <img src="{{ url_for('static', filename='images/logo-mark.svg') }}" alt="" class="h-16 w-16">
  <p class="mt-6 text-sm font-semibold uppercase tracking-wider text-sun-600">Error {{ code }}</p>
  <h1 class="mt-2 text-3xl font-bold text-slate-900">{{ title }}</h1>
  <p class="mt-3 max-w-md text-slate-500">{{ message }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn-primary mt-8">Back to dashboard</a>
</div>
{% endmacro %}
{% block content %}{{ error_body() }}{% endblock %}
{% block public_content %}{{ error_body() }}{% endblock %}
